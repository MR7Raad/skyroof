<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Skyroof Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-black: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #1c1a15;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa8222;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --text-white: #f8f8f8;
      --text-muted: #a3a3a3;
      --border-gold: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ================= الهيدر العائم ================= */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(10, 10, 10, 0.92), rgba(10, 10, 10, 0));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .brand-mini i {
      font-size: 1.2rem;
      filter: drop-shadow(0 0 6px var(--gold-glow));
    }

    .lang-wrapper {
      position: relative;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(20, 20, 20, 0.88);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 6px 12px;
      border-radius: 50px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
    }

    .lang-btn:hover {
      background: var(--gold);
      color: var(--bg-black);
    }

    .lang-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-end: 0;
      background: #141414;
      border: 1px solid var(--gold);
      border-radius: 14px;
      min-width: 165px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 1100;
    }

    .lang-dropdown.active {
      display: flex;
      animation: fadeInDown 0.2s ease;
    }

    .lang-option {
      background: transparent;
      border: none;
      color: var(--text-white);
      padding: 11px 16px;
      text-align: start;
      font-family: 'Cairo', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.2s;
    }

    .lang-option:last-child {
      border-bottom: none;
    }

    .lang-option:hover,
    .lang-option.selected {
      background: rgba(212, 175, 55, 0.18);
      color: var(--gold-light);
    }

    /* ================= نظام الصفحات ================= */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
    }

    .page.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    /* ================= الصفحة الأولى: الرئيسية ================= */
    #home-page {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f190c 0%, #0a0a0a 70%);
    }

    .fullscreen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      pointer-events: none;
    }

    .home-overlay {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      background: linear-gradient(
        to bottom,
        rgba(10, 10, 10, 0.42) 0%,
        rgba(10, 10, 10, 0.25) 40%,
        rgba(10, 10, 10, 0.88) 78%,
        rgba(10, 10, 10, 0.98) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 84px 20px 32px;
      text-align: center;
    }

    .hero-title {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff6d6 0%, #d4af37 50%, #aa8222 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 20px;
      max-width: 340px;
    }

    .home-footer {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .menu-cta-btn {
      width: 100%;
      max-width: 260px;
      padding: 14px 28px;
      border-radius: 50px;
      border: 2px solid var(--gold-light);
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--bg-black);
      font-family: 'Cairo', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 25px var(--gold-glow);
      animation: pulseGold 2.2s infinite;
      transition: transform 0.2s ease;
      margin-bottom: 4px;
    }

    .menu-cta-btn:active {
      transform: scale(0.96);
    }

    .insta-link,
    .website-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-gold);
      transition: all 0.25s ease;
    }

    .insta-link i,
    .website-link i {
      font-size: 1.1rem;
      color: var(--gold);
    }

    .insta-link:hover,
    .website-link:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
    }

    .reservation-box {
      width: 100%;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      margin-top: 4px;
    }

    .res-label {
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .res-numbers {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .res-phone {
      flex: 1;
      min-width: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--text-white);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      direction: ltr;
      transition: all 0.2s;
    }

    .res-phone i {
      color: var(--gold);
    }

    .res-phone:hover {
      background: var(--gold);
      color: var(--bg-black);
    }

    .res-phone:hover i {
      color: var(--bg-black);
    }

    /* ================= الصفحة الثانية: المنيو ================= */
    #menu-page {
      padding-top: 64px;
      padding-bottom: 100px;
      max-width: 680px;
      margin: 0 auto;
    }

    .menu-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      padding: 7px 14px;
      border-radius: 50px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .rect-video-container {
      margin: 0 16px 18px;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid var(--gold);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.18);
      position: relative;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    .rect-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .video-badge {
      position: absolute;
      bottom: 10px;
      inset-inline-start: 12px;
      background: rgba(10, 10, 10, 0.8);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      display: none;
    }

    .video-badge.has-text {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .categories-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 16px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      color: var(--text-white);
      font-family: 'Cairo', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cat-pill i {
      color: var(--gold);
      font-size: 1.05rem;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--bg-black);
      border-color: var(--gold-light);
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .cat-pill.active i {
      color: var(--bg-black);
    }

    .menu-items-list {
      padding: 4px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .menu-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .item-img-box {
      width: 92px;
      height: 92px;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      background: #1c1c1c;
      position: relative;
    }

    .item-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .menu-card:hover .item-img-box img {
      transform: scale(1.08);
    }

    .item-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .item-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold-light);
      line-height: 1.3;
    }

    .item-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }

    .item-price {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--gold);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .currency-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--gold-light);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-gold);
      border-radius: 50px;
      padding: 3px;
    }

    .plus-btn,
    .minus-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .plus-btn {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--bg-black);
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .plus-btn:active {
      transform: scale(0.9);
    }

    .minus-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--gold-light);
    }

    .qty-count {
      font-size: 0.88rem;
      font-weight: 800;
      min-width: 18px;
      text-align: center;
      color: var(--text-white);
    }

    /* ================= شريط سلة الواتساب العائم ================= */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 648px;
      margin: 0 auto;
      background: linear-gradient(135deg, #1a1812 0%, #0d0d0d 100%);
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px var(--gold-glow);
      z-index: 950;
    }

    .cart-bar.visible {
      display: flex;
      animation: slideUp 0.25s ease;
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .cart-count-text {
      font-size: 0.8rem;
      color: var(--gold-light);
      font-weight: 600;
    }

    .cart-total-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gold);
    }

    .review-order-btn {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
    }

    /* ================= نافذة مراجعة الطلب وإرساله للواتساب ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 1200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .order-modal {
      width: 100%;
      max-width: 540px;
      background: #141414;
      border-top: 2px solid var(--gold);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      color: var(--gold);
      font-size: 1.15rem;
      font-weight: 800;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-white);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }

    .order-items-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .order-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .order-line-img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--gold);
      flex-shrink: 0;
    }

    .order-line-info {
      flex: 1;
      min-width: 0;
    }

    .order-line-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--gold-light);
    }

    .order-line-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .customer-note-input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text-white);
      font-family: 'Cairo', sans-serif;
      font-size: 0.88rem;
      margin-bottom: 14px;
      outline: none;
    }

    .customer-note-input:focus {
      border-color: var(--gold);
    }

    .whatsapp-send-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .clear-cart-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 80, 80, 0.35);
      background: transparent;
      color: #ff7b7b;
      font-family: 'Cairo', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 1500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .hero-title {
        font-size: 1.55rem;
      }

      .hero-subtitle {
        font-size: 0.86rem;
      }
    }

    @keyframes pulseGold {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.65); }
      70% { box-shadow: 0 0 0 14px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand-mini" onclick="navigateTo('home')">
      <i class="fa-solid fa-home"></i>
      <span data-i18n="brandName">skyroof</span>
    </div>

    <div class="lang-wrapper">
      <button class="lang-btn" id="langToggleBtn" onclick="toggleLangMenu(event)">
        <i class="fa-solid fa-globe"></i>
        <span id="currentLangLabel">العربية</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
      </button>

      <div class="lang-dropdown" id="langDropdown">
        <button class="lang-option selected" data-lang="ar" onclick="setLanguage('ar')">
          <span>العربية</span>
          <span>🇮🇶</span>
        </button>
        <button class="lang-option" data-lang="en" onclick="setLanguage('en')">
          <span>English</span>
          <span>en</span>
        </button>
        <button class="lang-option" data-lang="ku" onclick="setLanguage('ku')">
          <span>کوردی</span>
          <span>kr</span>
        </button>
      </div>
    </div>
  </header>

    const itemById = new Map(MENU_ITEMS.map((item) => [item.id, item]));
    const state = {
      lang: localStorage.getItem(CONFIG.langStorageKey) || "ar",

      cart: new Map(),
      transCache: loadTransCache()
    };

    const dom = {
      homePage: document.getElementById("home-page"),
      menuPage: document.getElementById("menu-page"),
      homeVideo: document.getElementById("homeVideo"),
      menuVideo: document.getElementById("menuVideo"),
      videoBadgeEl: document.getElementById("videoBadgeEl"),
      langDropdown: document.getElementById("langDropdown"),
      currentLangLabel: document.getElementById("currentLangLabel"),
      backArrowIcon: document.getElementById("backArrowIcon"),
      categoriesContainer: document.getElementById("categoriesContainer"),
      menuItemsContainer: document.getElementById("menuItemsContainer"),
      cartBar: document.getElementById("cartBar"),
      cartCountLabel: document.getElementById("cartCountLabel"),
      cartTotalLabel: document.getElementById("cartTotalLabel"),
      orderModal: document.getElementById("orderModal"),
      modalOrderItems: document.getElementById("modalOrderItems"),
      modalTotalValue: document.getElementById("modalTotalValue"),
      orderNoteInput: document.getElementById("orderNoteInput"),
      toastMsg: document.getElementById("toastMsg")
    };

    function loadTransCache() {
      try {
        return JSON.parse(localStorage.getItem(CONFIG.cacheStorageKey) || "{}");
      } catch {
        return {};
      }
    }

    function saveTransCache() {
      try {
        localStorage.setItem(CONFIG.cacheStorageKey, JSON.stringify(state.transCache));
      } catch {
        // تجاهل خطأ امتلاء التخزين
      }
    }

    function formatIQD(amount) {
      return Number(amount || 0).toLocaleString("en-US");
    }

    function getLocalizedText(obj, lang = state.lang) {
      if (!obj) return "";
      return obj[lang] || obj.ar || "";
    }

    function syncVideosPlayback(pageName) {
      const targetVideo = pageName === "menu" ? dom.menuVideo : dom.homeVideo;
      if (targetVideo && targetVideo.style.display !== "none") {
        targetVideo.play().catch(() => {
          // تجاهل منع التشغيل التلقائي إن وُجد
        });
      }
    }

    async function fetchTranslation(text, targetLang) {
      const clean = (text || "").trim();
      if (!clean) return "";
      const key = `${clean}__${targetLang}`;
      if (state.transCache[key]) return state.transCache[key];

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3500);

      try {
        const pair = targetLang === "ku" ? "ar|ckb" : "ar|en";
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${pair}`;
        const res = await fetch(url, { signal: controller.signal });
        const data = await res.json();
        const result = data?.responseData?.translatedText;
        if (result && !result.toUpperCase().includes("MYMEMORY WARNING")) {
          state.transCache[key] = result;
          saveTransCache();
          return result;
        }
      } catch {
        // عودة سريعة للنص الأصلي عند بطء الشبكة
      } finally {
        clearTimeout(timeout);
      }
      return clean;
    }

    async function addMenuItem({ cat, price, img, nameAr, descAr, nameEn, nameKu, descEn, descKu }) {
      const cleanName = (nameAr || "").trim();
      if (!cleanName) return null;

      const existing = MENU_ITEMS.find((i) => i.name.ar.trim() === cleanName);
      if (existing) return existing;

      const nextId = MENU_ITEMS.length ? MENU_ITEMS[MENU_ITEMS.length - 1].id + 1 : 1;
      const item = {
        id: nextId,
        cat: cat || "grills",
        price: Number(price) || 0,
        img: img || "",
        name: { ar: cleanName, en: nameEn || cleanName, ku: nameKu || cleanName },
        desc: { ar: descAr || "", en: descEn || descAr || "", ku: descKu || descAr || "" }
      };

      MENU_ITEMS.push(item);
      itemById.set(item.id, item);
      renderMenuItems();

      if (!nameEn || !nameKu || (descAr && (!descEn || !descKu))) {
        const [eName, kName, eDesc, kDesc] = await Promise.all([
          nameEn ? Promise.resolve(nameEn) : fetchTranslation(cleanName, "en"),
          nameKu ? Promise.resolve(nameKu) : fetchTranslation(cleanName, "ku"),
          !descAr ? Promise.resolve("") : (descEn ? Promise.resolve(descEn) : fetchTranslation(descAr, "en")),
          !descAr ? Promise.resolve("") : (descKu ? Promise.resolve(descKu) : fetchTranslation(descAr, "ku"))
        ]);
        item.name.en = eName;
        item.name.ku = kName;
        item.desc.en = eDesc;
        item.desc.ku = kDesc;
        renderMenuItems();
      }

      return item;
    }

    const addArabicMenuItem = addMenuItem;

    function navigateTo(pageName) {
      const isMenu = pageName === "menu";
      dom.homePage.classList.toggle("active", !isMenu);
      dom.menuPage.classList.toggle("active", isMenu);
      if (isMenu) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        syncVideosPlayback("menu");
      } else {
        syncVideosPlayback("home");
      }
    }

    function toggleLangMenu(e) {
      e.stopPropagation();
      dom.langDropdown.classList.toggle("active");
    }

    document.addEventListener("click", () => {
      dom.langDropdown.classList.remove("active");
    });

    function applyLocaleStrings() {
      const t = TRANSLATIONS[state.lang] || TRANSLATIONS.ar;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (key in t) el.textContent = t[key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        const key = el.getAttribute("data-i18n-placeholder");
        if (key in t) el.placeholder = t[key];
      });
      if (dom.videoBadgeEl) {
        dom.videoBadgeEl.classList.toggle("has-text", Boolean(t.videoPromo && t.videoPromo.trim()));
      }
    }

    function setLanguage(lang) {
      if (!TRANSLATIONS[lang]) return;
      state.lang = lang;
      localStorage.setItem(CONFIG.langStorageKey, lang);

      const t = TRANSLATIONS[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      dom.currentLangLabel.textContent = t.langName;

      if (dom.backArrowIcon) {
        dom.backArrowIcon.className = t.dir === "rtl" ? "fa-solid fa-arrow-right" : "fa-solid fa-arrow-left";
      }

      document.querySelectorAll(".lang-option").forEach((opt) => {
        opt.classList.toggle("selected", opt.dataset.lang === lang);
      });

      applyLocaleStrings();
      renderCategories();
      renderMenuItems();
      updateCartBar();
      if (dom.orderModal.classList.contains("open")) {
        renderOrderModal();
      }
    }

    function renderCategories() {
      const frag = document.createDocumentFragment();
      CATEGORIES.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `cat-pill${cat.id === state.category ? " active" : ""}`;
        btn.onclick = () => selectCategory(cat.id);
        btn.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${getLocalizedText(cat.name)}</span>`;
        frag.appendChild(btn);
      });
      dom.categoriesContainer.replaceChildren(frag);
    }

    function selectCategory(catId) {
      if (state.category === catId) return;
      state.category = catId;
      renderCategories();
      renderMenuItems();
    }

    function buildQtyControls(itemId, qty) {
      const minusHtml = qty > 0
        ? `<button type="button" class="minus-btn" onclick="changeQty(${itemId}, -1)" aria-label="Remove"><i class="fa-solid fa-minus"></i></button><span class="qty-count">${qty}</span>`
        : "";
      return `
        <div class="qty-controls">
          ${minusHtml}
          <button type="button" class="plus-btn" onclick="changeQty(${itemId}, 1)" aria-label="Add"><i class="fa-solid fa-plus"></i></button>
        </div>
      `;
    }

    function renderMenuItems() {
      const t = TRANSLATIONS[state.lang] || TRANSLATIONS.ar;
      const list = state.category === "all"
        ? MENU_ITEMS
        : MENU_ITEMS.filter((item) => item.cat === state.category);

      const frag = document.createDocumentFragment();
      list.forEach((item) => {
        const title = getLocalizedText(item.name);
        const desc = getLocalizedText(item.desc);
        const qty = state.cart.get(item.id) || 0;
        const imgSrc = item.img || CONFIG.fallbackImg;

        const card = document.createElement("div");
        card.className = "menu-card";
        card.innerHTML = `
          <div class="item-img-box">
            <img src="${imgSrc}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.src='${CONFIG.fallbackImg}';" />
          </div>
          <div class="item-details">
            <div>
              <div class="item-title">${title}</div>
              <div class="item-desc">${desc}</div>
            </div>
            <div class="item-bottom-row">
              <div class="item-price">
                <span>${formatIQD(item.price)}</span>
                <span class="currency-label">${t.currency}</span>
              </div>
              ${buildQtyControls(item.id, qty)}
            </div>
          </div>
        `;
        frag.appendChild(card);
      });

      dom.menuItemsContainer.replaceChildren(frag);
    }

    function changeQty(itemId, delta) {
      const current = state.cart.get(itemId) || 0;
      const next = current + delta;

      if (next <= 0) {
        state.cart.delete(itemId);
      } else {
        state.cart.set(itemId, next);
        if (delta > 0) showToast((TRANSLATIONS[state.lang] || TRANSLATIONS.ar).addedToast);
      }

      renderMenuItems();
      updateCartBar();
      if (dom.orderModal.classList.contains("open")) {
        renderOrderModal();
      }
    }

    function calcCartTotals() {
      let count = 0;
      let total = 0;
      state.cart.forEach((qty, id) => {
        const item = itemById.get(id);
        if (!item) return;
        count += qty;
        total += item.price * qty;
      });
      return { count, total };
    }

    function updateCartBar() {
      const t = TRANSLATIONS[state.lang] || TRANSLATIONS.ar;
      const { count, total } = calcCartTotals();

      if (count > 0) {
        dom.cartBar.classList.add("visible");
        dom.cartCountLabel.textContent = `${count} ${t.itemsCount}`;
        dom.cartTotalLabel.textContent = `${formatIQD(total)} ${t.currency}`;
      } else {
        dom.cartBar.classList.remove("visible");
        closeOrderModal();
      }
    }

    let toastTimer;
    function showToast(msg) {
      dom.toastMsg.textContent = msg;
      dom.toastMsg.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => dom.toastMsg.classList.remove("show"), 1400);
    }

    function openOrderModal() {
      renderOrderModal();
      dom.orderModal.classList.add("open");
    }

    function closeOrderModal() {
      dom.orderModal.classList.remove("open");
    }

    function handleBackdropClick(e) {
      if (e.target === dom.orderModal) closeOrderModal();
    }

    function renderOrderModal() {
      const t = TRANSLATIONS[state.lang] || TRANSLATIONS.ar;
      const frag = document.createDocumentFragment();
      let totalPrice = 0;

      state.cart.forEach((qty, id) => {
        const item = itemById.get(id);
        if (!item) return;
        const lineTotal = item.price * qty;
        totalPrice += lineTotal;
        const title = getLocalizedText(item.name);
        const imgSrc = item.img || CONFIG.fallbackImg;

        const row = document.createElement("div");
        row.className = "order-line";
        row.innerHTML = `
          <img src="${imgSrc}" alt="${title}" class="order-line-img" onerror="this.onerror=null;this.src='${CONFIG.fallbackImg}';" />
          <div class="order-line-info">
            <div class="order-line-name">${title}</div>
            <div class="order-line-sub">${qty} × ${formatIQD(item.price)} = ${formatIQD(lineTotal)} ${t.currency}</div>
          </div>
          ${buildQtyControls(item.id, qty)}
        `;
        frag.appendChild(row);
      });

      dom.modalOrderItems.replaceChildren(frag);
      dom.modalTotalValue.textContent = `${formatIQD(totalPrice)} ${t.currency}`;
    }

    function clearCart() {
      state.cart.clear();
      renderMenuItems();
      updateCartBar();
    }

    function sendOrderToWhatsApp() {
      const t = TRANSLATIONS[state.lang] || TRANSLATIONS.ar;
      const lines = [t.waHeader, ""];
      let totalPrice = 0;

      state.cart.forEach((qty, id) => {
        const item = itemById.get(id);
        if (!item) return;
        const title = getLocalizedText(item.name);
        const lineTotal = item.price * qty;
        totalPrice += lineTotal;
        lines.push(`• ${title} (×${qty}) — ${formatIQD(lineTotal)} ${t.currency}`);
      });

      lines.push("", `${t.waTotal} ${formatIQD(totalPrice)} ${t.currency}`);

      const note = dom.orderNoteInput.value.trim();
      if (note) lines.push(`${t.waNote} ${note}`);

      const waUrl = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(waUrl, "_blank", "noopener,noreferrer");
    }

    setLanguage(state.lang);
    syncVideosPlayback("home");
  </script>
</body>
</html>
